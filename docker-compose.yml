# One-command PostgreSQL for local development:
#
#   docker compose up -d
#
# Then set in .env:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/ticket_tech_titan
# and initialize the schema + categories:
#   python database/init_db.py

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_tech_titan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_tech_titan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
